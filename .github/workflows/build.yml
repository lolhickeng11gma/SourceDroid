      - name: Patch engine activity and add fonts
        working-directory: project
        run: |
          cat > app/src/engine/java/com/valvesoftware/ValveActivity2.java <<'JAVA_EOF'
          package com.valvesoftware;

          import android.content.res.AssetManager;
          import android.os.Bundle;

          import org.libsdl.app.SDLActivity;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          /**
           * Host activity for the nillerusr/source-engine Android port.
           *
           * The class name and the native methods are fixed by the engine (launcher/android/main.cpp).
           * Env vars the engine reads: VALVE_GAME_PATH (game root), APP_LIB_PATH (native libs),
           * APP_DATA_PATH (fonts are read from $APP_DATA_PATH/files/*.ttf).
           */
          public class ValveActivity2 extends SDLActivity {
              private static native int setenv(String name, String value, int overwrite);
              private static native void setArgs(String args);
              public static native void nativeOnActivityResult(Object activity, int req, int res, Object data);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  copyFonts();
                  super.onCreate(savedInstanceState);
                  String root = getIntent().getStringExtra("root");
                  String[] args = getIntent().getStringArrayExtra("args");
                  if (root == null) root = "";
                  StringBuilder sb = new StringBuilder();
                  if (args != null) for (String a : args) sb.append(a).append(' ');

                  File files = getFilesDir();
                  setenv("VALVE_GAME_PATH", root, 1);
                  setenv("APP_DATA_PATH", files.getParent(), 1);
                  setenv("APP_LIB_PATH", getApplicationInfo().nativeLibraryDir, 1);
                  setenv("TMPDIR", getCacheDir().getAbsolutePath(), 1);

                  // Touch-control materials (icons) shipped in assets/extras: the engine mounts this dir.
                  try {
                      File extras = copyAssetTree("extras", new File(files, "extras"));
                      if (extras != null) setenv("EXTRAS_VPK_PATH", extras.getAbsolutePath() + "/", 1);
                  } catch (Exception ignored) {
                  }

                  // Per-game client/server libraries (cs:s, episodic, ...) from assets/gamelibs/<variant>.
                  String variant = pickVariant(args);
                  if (variant != null) {
                      try {
                          File mod = copyAssetTree("gamelibs/" + variant, new File(files, "gamelibs/" + variant));
                          if (mod != null) setenv("APP_MOD_LIB", mod.getAbsolutePath(), 1);
                      } catch (Exception ignored) {
                      }
                  }
                  setArgs(sb.toString().trim());
              }

              /** Maps "-game <dir>" to the name of the client/server variant, or null for the default (HL2) one. */
              private static String pickVariant(String[] args) {
                  if (args == null) return null;
                  for (int i = 0; i + 1 < args.length; i++) {
                      if (!"-game".equalsIgnoreCase(args[i])) continue;
                      String g = args[i + 1].replace('\\', '/');
                      int k = g.lastIndexOf('/');
                      if (k >= 0) g = g.substring(k + 1);
                      g = g.toLowerCase();
                      if (g.equals("cstrike")) return "cstrike";
                      if (g.equals("episodic") || g.equals("ep2")) return "episodic";
                      if (g.equals("portal")) return "portal";
                      if (g.equals("hl2mp")) return "hl2mp";
                      return null;
                  }
                  return null;
              }

              /** Copies an assets subtree to dest (once per app version). Returns dest, or null if the asset dir is empty/missing. */
              private File copyAssetTree(String assetPath, File dest) throws Exception {
                  AssetManager am = getAssets();
                  String[] top = am.list(assetPath);
                  if (top == null || top.length == 0) return null;
                  long stamp = getPackageManager().getPackageInfo(getPackageName(), 0).lastUpdateTime;
                  File marker = new File(dest, ".stamp");
                  if (marker.exists()) {
                      try (BufferedReader r = new BufferedReader(new InputStreamReader(new java.io.FileInputStream(marker)))) {
                          if (String.valueOf(stamp).equals(r.readLine())) return dest;
                      } catch (Exception ignored) {
                      }
                  }
                  copyAssetDir(am, assetPath, dest);
                  try (OutputStream o = new FileOutputStream(marker)) {
                      o.write(String.valueOf(stamp).getBytes());
                  }
                  return dest;
              }

              private void copyAssetDir(AssetManager am, String path, File dest) throws Exception {
                  String[] kids = am.list(path);
                  if (kids != null && kids.length > 0) {
                      dest.mkdirs();
                      for (String k : kids) copyAssetDir(am, path + "/" + k, new File(dest, k));
                      return;
                  }
                  File parent = dest.getParentFile();
                  if (parent != null) parent.mkdirs();
                  if (dest.exists()) dest.setWritable(true);
                  try (InputStream in = am.open(path); OutputStream o = new FileOutputStream(dest)) {
                      byte[] buf = new byte[65536];
                      int r;
                      while ((r = in.read(buf)) > 0) o.write(buf, 0, r);
                  }
                  dest.setReadable(true, false);
                  if (dest.getName().endsWith(".so")) dest.setReadOnly(); // Android 14: loaded code must not be writable
              }

              /** Copies assets/fonts/* into <app files dir>, where the engine looks for them. */
              private void copyFonts() {
                  try {
                      AssetManager am = getAssets();
                      String[] names = am.list("fonts");
                      if (names == null) return;
                      File dir = getFilesDir();
                      for (String n : names) {
                          File out = new File(dir, n);
                          if (out.exists() && out.length() > 0) continue;
                          try (InputStream in = am.open("fonts/" + n); OutputStream o = new FileOutputStream(out)) {
                              byte[] buf = new byte[16384];
                              int r;
                              while ((r = in.read(buf)) > 0) o.write(buf, 0, r);
                          }
                      }
                  } catch (Exception ignored) {
                  }
              }

              @Override
              protected String[] getLibraries() {
                  List<String> libs = new ArrayList<>();
                  try {
                      BufferedReader r = new BufferedReader(new InputStreamReader(getAssets().open("engine_libs.txt")));
                      String line;
                      while ((line = r.readLine()) != null) {
                          line = line.trim();
                          // client/server are loaded by the engine itself (per-game variants may replace them)
                          if (line.equals("client") || line.equals("server")) continue;
                          if (!line.isEmpty()) libs.add(line);
                      }
                      r.close();
                  } catch (Exception e) {
                      libs.clear();
                      libs.add("SDL2");
                      libs.add("launcher");
                  }
                  return libs.toArray(new String[0]);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  // The engine keeps global state in its native libs; a fresh process is the only clean restart.
                  android.os.Process.killProcess(android.os.Process.myPid());
              }

              @Override
              protected String getMainFunction() {
                  return "LauncherMainAndroid";
              }
          }
          JAVA_EOF
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-droid-fallback
          mkdir -p app/src/main/assets/fonts
