      - name: Build engine
        if: ${{ inputs.with_engine }}
        working-directory: project
        env:
          ENGINE_REF: ed8209cc35c61fbd8ddff8480962a01c981eef2f
        run: bash scripts/build_engine.sh
      - name: Build per-game client/server libraries (cstrike, episodic, portal, hl2mp)
        if: ${{ inputs.with_engine }}
        continue-on-error: true
        working-directory: project
        run: |
          NDK="$PWD/.ndk/android-ndk-r10e"
          export ANDROID_NDK_HOME="$NDK" NDK_HOME="$NDK"
          STRIP=$(find "$NDK/toolchains/arm-linux-androideabi-4.9" -name 'arm-linux-androideabi-strip' | head -1)
          PY="$(command -v python2 || command -v python3)"
          cd engine
          for g in cstrike episodic portal hl2mp; do
            echo "=== game variant: $g"
            touch /tmp/mark_$g; sleep 1
            (
              set -e
              "$PY" ./waf configure -T release --android=armeabi-v7a-hard,4.9,21 --togles --disable-warns --build-games=$g
              "$PY" ./waf build --targets=client,server
              mkdir -p ../app/src/main/assets/gamelibs/$g
              for n in client server; do
                f=$(find build -name "lib$n.so" -newer /tmp/mark_$g | head -1)
                [ -n "$f" ] || { echo "lib$n.so not built for $g"; exit 1; }
                cp -v "$f" ../app/src/main/assets/gamelibs/$g/
                "$STRIP" --strip-unneeded ../app/src/main/assets/gamelibs/$g/lib$n.so
              done
            ) || { echo "variant $g FAILED, skipping"; rm -rf ../app/src/main/assets/gamelibs/$g; }
          done
          ls -laR ../app/src/main/assets/gamelibs || true
      - name: Symbolize call stack from bt.txt (if the file exists in the repo)
        if: ${{ inputs.with_engine }}
        run: |
          [ -f bt.txt ] || [ -f oom_trace.txt ] || { echo "no bt.txt / oom_trace.txt, skipping"; exit 0; }
          TOOL=$(find project/.ndk/android-ndk-r10e/toolchains/arm-linux-androideabi-4.9 -name 'arm-linux-androideabi-addr2line' | head -1)
          python3 - "$TOOL" <<'PY'
          import re, subprocess, sys, glob, os
          tool = sys.argv[1]
          lines = []
          for fn in ("bt.txt", "oom_trace.txt"):
              if os.path.exists(fn):
                  lines += open(fn, errors="ignore").read().splitlines()
          for line in lines:
              m = re.match(r"\s*0x([0-9A-Fa-f]+):.*?(\S+\.so)\)", line)
              if not m:
                  continue
              off, lib = int(m.group(1), 16), os.path.basename(m.group(2))
              cands = glob.glob("project/engine/build/**/" + lib, recursive=True)
              if not cands:
                  print("NOLIB", lib, hex(off)); continue
              a = (off & ~1) - 2
              r = subprocess.run([tool, "-f", "-C", "-e", cands[0], hex(a)], capture_output=True, text=True)
              print("SYM", lib, hex(off), "=>", " @ ".join(r.stdout.split("\n")[:2]))
          PY

      - name: Disable SDL HIDAPI (its native library is not built)
        working-directory: project
        run: |
          F=engine/thirdparty/SDL-src/android-project/app/src/main/java/org/libsdl/app/HIDDeviceManager.java
          sed -i 's/public static HIDDeviceManager acquire(Context context) {/public static HIDDeviceManager acquire(Context context) { if (true) return null;/' "$F"
          grep -n "if (true) return null" "$F"
      - name: Strip debug symbols from engine libraries
        if: ${{ inputs.with_engine }}
        working-directory: project
        run: |
          STRIP=$(find .ndk/android-ndk-r10e/toolchains/arm-linux-androideabi-4.9 -name 'arm-linux-androideabi-strip' | head -1)
          echo "strip tool: $STRIP"
          du -sh app/src/main/jniLibs
          find app/src/main/jniLibs -name '*.so' -exec "$STRIP" --strip-unneeded {} \;
          du -sh app/src/main/jniLibs
      - name: Build APK
        working-directory: project
        run: |
          sed -i '/^android {/a\    lint { checkReleaseBuilds = false; abortOnError = false }' app/build.gradle.kts
          sed -i 's/compileSdk = 34/compileSdk = 35/; s/targetSdk = 34/targetSdk = 35/' app/build.gradle.kts
          echo 'android.suppressUnsupportedCompileSdk=35' >> gradle.properties
          grep -n 'compileSdk\|targetSdk' app/build.gradle.kts
          gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SourceDroid-apk
          path: project/app/build/outputs/apk/release/*.apk
