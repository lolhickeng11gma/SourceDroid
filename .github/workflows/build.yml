name: Build APK
on:
  workflow_dispatch:
    inputs:
      with_engine:
        description: "Build the Source engine into the APK (long)"
        type: boolean
        default: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          check() {
            f="chunks/part$1.txt"
            [ -f "$f" ] || { echo "ERROR: file $f is missing"; exit 1; }
            h=$(tr -d ' \r\n\t' < "$f" | sha256sum | cut -d' ' -f1)
            [ "$h" = "$2" ] || { echo "ERROR: file $f is damaged or incomplete, create it again"; exit 1; }
          }
          check 1 ec02df5874855ae519eeafea7dfa51a2f2daf384b692bf1fa3062d5c528b8156
          check 2 7e60bf90484b4aa4fa521e04fad17a82ce2a66a6f81aeb8174dbc3c54130a128
          check 3 22766befe8b5b26b90b1abef345dbd9e3af6e169a06c50773d4cd73896c18d7a
          mkdir project
          cat chunks/part*.txt | base64 -d | tar xJ -C project
