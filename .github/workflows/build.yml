name: Build APK
on:
  workflow_dispatch:
    inputs:
      with_engine:
        description: "Build the Source engine into the APK (long)"
        type: boolean
        default: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          check() {
            f="chunks/part$1.txt"
            [ -f "$f" ] || { echo "ERROR: file $f is missing"; exit 1; }
            h=$(tr -d ' \r\n\t' < "$f" | sha256sum | cut -d' ' -f1)
            [ "$h" = "$2" ] || { echo "ERROR: file $f is damaged or incomplete, create it again"; exit 1; }
          }
          check 1 ec02df5874855ae519eeafea7dfa51a2f2daf384b692bf1fa3062d5c528b8156
          check 2 7e60bf90484b4aa4fa521e04fad17a82ce2a66a6f81aeb8174dbc3c54130a128
          check 3 22766befe8b5b26b90b1abef345dbd9e3af6e169a06c50773d4cd73896c18d7a
          mkdir project
          cat chunks/part*.txt | base64 -d | tar xJ -C project
      - name: Patch engine activity and add fonts
        working-directory: project
        run: |
          cat > app/src/engine/java/com/valvesoftware/ValveActivity2.java <<'JAVA_EOF'
          package com.valvesoftware;

          import android.content.res.AssetManager;
          import android.os.Bundle;

          import org.libsdl.app.SDLActivity;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          /**
           * Host activity for the nillerusr/source-engine Android port.
           *
           * The class name and the native methods are fixed by the engine (launcher/android/main.cpp).
           * Env vars the engine reads: VALVE_GAME_PATH (game root), APP_LIB_PATH (native libs),
           * APP_DATA_PATH (fonts are read from $APP_DATA_PATH/files/*.ttf).
           */
          public class ValveActivity2 extends SDLActivity {
              private static native int setenv(String name, String value, int overwrite);
              private static native void setArgs(String args);
              public static native void nativeOnActivityResult(Object activity, int req, int res, Object data);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  copyFonts();
                  super.onCreate(savedInstanceState);
                  String root = getIntent().getStringExtra("root");
                  String[] args = getIntent().getStringArrayExtra("args");
                  if (root == null) root = "";
                  StringBuilder sb = new StringBuilder();
                  if (args != null) for (String a : args) sb.append(a).append(' ');

                  File files = getFilesDir();
                  setenv("VALVE_GAME_PATH", root, 1);
                  setenv("APP_DATA_PATH", files.getParent(), 1);
                  setenv("APP_LIB_PATH", getApplicationInfo().nativeLibraryDir, 1);
                  setenv("TMPDIR", getCacheDir().getAbsolutePath(), 1);

                  // Touch-control materials (icons) shipped in assets/extras: the engine mounts this dir.
                  try {
                      File extras = copyAssetTree("extras", new File(files, "extras"));
                      if (extras != null) setenv("EXTRAS_VPK_PATH", extras.getAbsolutePath() + "/", 1);
                  } catch (Exception ignored) {
                  }

                  // Per-game client/server libraries (cs:s, episodic, ...) from assets/gamelibs/<variant>.
                  String variant = pickVariant(args);
                  if (variant != null) {
                      try {
                          File mod = copyAssetTree("gamelibs/" + variant, new File(files, "gamelibs/" + variant));
                          if (mod != null) setenv("APP_MOD_LIB", mod.getAbsolutePath(), 1);
                      } catch (Exception ignored) {
                      }
                  }
                  setArgs(sb.toString().trim());
              }

              /** Maps "-game <dir>" to the name of the client/server variant, or null for the default (HL2) one. */
              private static String pickVariant(String[] args) {
                  if (args == null) return null;
                  for (int i = 0; i + 1 < args.length; i++) {
                      if (!"-game".equalsIgnoreCase(args[i])) continue;
                      String g = args[i + 1].replace('\\', '/');
                      int k = g.lastIndexOf('/');
                      if (k >= 0) g = g.substring(k + 1);
                      g = g.toLowerCase();
                      if (g.equals("cstrike")) return "cstrike";
                      if (g.equals("episodic") || g.equals("ep2")) return "episodic";
                      return null;
                  }
                  return null;
              }

              /** Copies an assets subtree to dest (once per app version). Returns dest, or null if the asset dir is empty/missing. */
              private File copyAssetTree(String assetPath, File dest) throws Exception {
                  AssetManager am = getAssets();
                  String[] top = am.list(assetPath);
                  if (top == null || top.length == 0) return null;
                  long stamp = getPackageManager().getPackageInfo(getPackageName(), 0).lastUpdateTime;
                  File marker = new File(dest, ".stamp");
                  if (marker.exists()) {
                      try (BufferedReader r = new BufferedReader(new InputStreamReader(new java.io.FileInputStream(marker)))) {
                          if (String.valueOf(stamp).equals(r.readLine())) return dest;
                      } catch (Exception ignored) {
                      }
                  }
                  copyAssetDir(am, assetPath, dest);
                  try (OutputStream o = new FileOutputStream(marker)) {
                      o.write(String.valueOf(stamp).getBytes());
                  }
                  return dest;
              }

              private void copyAssetDir(AssetManager am, String path, File dest) throws Exception {
                  String[] kids = am.list(path);
                  if (kids != null && kids.length > 0) {
                      dest.mkdirs();
                      for (String k : kids) copyAssetDir(am, path + "/" + k, new File(dest, k));
                      return;
                  }
                  File parent = dest.getParentFile();
                  if (parent != null) parent.mkdirs();
                  if (dest.exists()) dest.setWritable(true);
                  try (InputStream in = am.open(path); OutputStream o = new FileOutputStream(dest)) {
                      byte[] buf = new byte[65536];
                      int r;
                      while ((r = in.read(buf)) > 0) o.write(buf, 0, r);
                  }
                  dest.setReadable(true, false);
                  if (dest.getName().endsWith(".so")) dest.setReadOnly(); // Android 14: loaded code must not be writable
              }

              /** Copies assets/fonts/* into <app files dir>, where the engine looks for them. */
              private void copyFonts() {
                  try {
                      AssetManager am = getAssets();
                      String[] names = am.list("fonts");
                      if (names == null) return;
                      File dir = getFilesDir();
                      for (String n : names) {
                          File out = new File(dir, n);
                          if (out.exists() && out.length() > 0) continue;
                          try (InputStream in = am.open("fonts/" + n); OutputStream o = new FileOutputStream(out)) {
                              byte[] buf = new byte[16384];
                              int r;
                              while ((r = in.read(buf)) > 0) o.write(buf, 0, r);
                          }
                      }
                  } catch (Exception ignored) {
                  }
              }

              @Override
              protected String[] getLibraries() {
                  List<String> libs = new ArrayList<>();
                  try {
                      BufferedReader r = new BufferedReader(new InputStreamReader(getAssets().open("engine_libs.txt")));
                      String line;
                      while ((line = r.readLine()) != null) {
                          line = line.trim();
                          // client/server are loaded by the engine itself (per-game variants may replace them)
                          if (line.equals("client") || line.equals("server")) continue;
                          if (!line.isEmpty()) libs.add(line);
                      }
                      r.close();
                  } catch (Exception e) {
                      libs.clear();
                      libs.add("SDL2");
                      libs.add("launcher");
                  }
                  return libs.toArray(new String[0]);
              }

              @Override
              protected String getMainFunction() {
                  return "LauncherMainAndroid";
              }
          }
          JAVA_EOF
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-droid-fallback
          mkdir -p app/src/main/assets/fonts
          for f in /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf /usr/share/fonts/truetype/dejavu/DejaVuSans-*.ttf; do
            cp "$f" "app/src/main/assets/fonts/$(basename "$f" | tr 'A-Z' 'a-z')"
          done
          cp /usr/share/fonts/truetype/liberation/LiberationMono-Regular.ttf app/src/main/assets/fonts/
          cp /usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf app/src/main/assets/fonts/DroidSansFallback.ttf || true
          ls -la app/src/main/assets/fonts
          pip install --quiet --break-system-packages pillow || pip install --quiet pillow
          cat > /tmp/touch_icons.py <<'ICONS_EOF'
          import math, os, struct, sys
          from PIL import Image, ImageDraw, ImageFont

          OUT = sys.argv[1]  # .../materials/vgui/touch
          os.makedirs(OUT, exist_ok=True)
          S = 128
          K = 4                      # supersampling
          FONT = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          W = (255, 255, 255, 240)   # icon strokes
          F = (255, 255, 255, 255)

          class P:
              def __init__(self):
                  self.im = Image.new("RGBA", (S * K, S * K), (255, 255, 255, 0))
                  self.d = ImageDraw.Draw(self.im)
                  self.d.ellipse((5 * K, 5 * K, (S - 6) * K, (S - 6) * K), fill=(255, 255, 255, 30), outline=W, width=5 * K)
              def _p(self, pts): return [(x * K, y * K) for x, y in pts]
              def line(self, pts, w=7): 
                  self.d.line(self._p(pts), fill=F, width=int(w * K), joint="curve")
                  for x, y in pts[:1] + pts[-1:]:
                      r = w * K / 2
                      self.d.ellipse((x * K - r, y * K - r, x * K + r, y * K + r), fill=F)
              def poly(self, pts): self.d.polygon(self._p(pts), fill=F)
              def rrect(self, b, r=4, fill=True, w=5):
                  bb = [v * K for v in b]
                  if fill: self.d.rounded_rectangle(bb, radius=r * K, fill=F)
                  else: self.d.rounded_rectangle(bb, radius=r * K, outline=F, width=int(w * K))
              def ell(self, b, fill=True, w=5):
                  bb = [v * K for v in b]
                  if fill: self.d.ellipse(bb, fill=F)
                  else: self.d.ellipse(bb, outline=F, width=int(w * K))
              def arc(self, b, a0, a1, w=7):
                  self.d.arc([v * K for v in b], a0, a1, fill=F, width=int(w * K))
              def erase_rrect(self, b, r=3):
                  self.d.rounded_rectangle([v * K for v in b], radius=r * K, fill=(255, 255, 255, 0))
              def text(self, t, cx, cy, size):
                  f = ImageFont.truetype(FONT, int(size * K))
                  bb = self.d.textbbox((0, 0), t, font=f)
                  self.d.text((cx * K - (bb[0] + bb[2]) / 2, cy * K - (bb[1] + bb[3]) / 2), t, font=f, fill=F)
              def done(self): return self.im.resize((S, S), Image.LANCZOS)

          def chev(p, cx, cy, up=True, w=7, s=20):
              dy = -s * 0.55 if up else s * 0.55
              p.line([(cx - s, cy - dy), (cx, cy + dy), (cx + s, cy - dy)], w)

          def walkie(p, digit):
              p.rrect((44, 46, 86, 108), 8)
              p.rrect((72, 22, 80, 48), 3)
              p.erase_rrect((51, 53, 79, 70), 3)
              p.text(digit, 65, 61.5, 17)
              for y in (80, 88, 96):
                  p.erase_rrect((52, y, 78, y + 3.5), 1.5)

          def icon(name):
              p = P()
              if name == "jump":
                  chev(p, 64, 52); chev(p, 64, 80)
              elif name == "crouch":
                  chev(p, 64, 46, up=False); chev(p, 64, 74, up=False)
                  p.line([(40, 98), (88, 98)], 6)
              elif name == "tduck":
                  chev(p, 64, 50, up=False, s=22)
                  p.ell((52, 76, 76, 100), fill=False, w=6)
                  p.ell((60, 84, 68, 92))
              elif name == "use":
                  for x, top in ((46, 44), (56, 38), (66, 40), (76, 48)):
                      p.rrect((x, top, x + 9, 82), 4.5)
                  p.rrect((44, 60, 85, 102), 12)
                  p.rrect((32, 66, 48, 80), 7)
              elif name == "shoot":
                  p.poly([(64, 24), (80, 46), (48, 46)])
                  p.rrect((48, 42, 80, 92), 4)
                  p.rrect((44, 94, 84, 104), 3)
              elif name == "shoot_alt":
                  p.ell((34, 34, 94, 94), fill=False, w=6)
                  p.line([(64, 20), (64, 48)], 6); p.line([(64, 80), (64, 108)], 6)
                  p.line([(20, 64), (48, 64)], 6); p.line([(80, 64), (108, 64)], 6)
                  p.ell((58, 58, 70, 70))
              elif name == "zoom":
                  p.ell((30, 28, 78, 76), fill=False, w=8)
                  p.line([(72, 70), (98, 98)], 10)
                  p.line([(54, 40), (54, 64)], 5); p.line([(42, 52), (66, 52)], 5)
              elif name == "speed":
                  p.ell((30, 68, 52, 102)); p.rrect((30, 58, 52, 72), 7)
                  p.ell((76, 28, 98, 62)); p.rrect((76, 20, 98, 34), 7)
              elif name == "load":
                  p.rrect((26, 40, 102, 100), 6)
                  p.rrect((26, 32, 58, 48), 4)
                  p.erase_rrect((34, 54, 94, 94), 3)
                  p.poly([(64, 58), (82, 78), (46, 78)]); p.rrect((58, 76, 70, 92), 2)
              elif name == "save":
                  p.rrect((28, 28, 100, 100), 6)
                  p.erase_rrect((40, 28, 84, 54), 2)
                  p.rrect((70, 32, 80, 50), 1)
                  p.erase_rrect((38, 68, 90, 100), 3)
                  p.rrect((42, 72, 86, 96), 2)
              elif name == "reload":
                  p.arc((32, 32, 96, 96), 40, 330, 9)
                  p.poly([(84, 18), (110, 40), (78, 52)])
              elif name == "flash_light_filled":
                  p.poly([(40, 30), (88, 30), (80, 52), (48, 52)])
                  p.rrect((52, 52, 76, 106), 5)
                  p.line([(64, 14), (64, 22)], 5); p.line([(28, 22), (36, 30)], 5); p.line([(100, 22), (92, 30)], 5)
              elif name == "next_weap":
                  p.poly([(30, 36), (70, 64), (30, 92)]); p.poly([(64, 36), (104, 64), (64, 92)])
              elif name == "prev_weap":
                  p.poly([(98, 36), (58, 64), (98, 92)]); p.poly([(64, 36), (24, 64), (64, 92)])
              elif name == "settings":
                  for i in range(8):
                      a = math.radians(i * 45)
                      cx, cy = 64 + 34 * math.cos(a), 64 + 34 * math.sin(a)
                      dx, dy = math.cos(a), math.sin(a)
                      nx, ny = -dy, dx
                      p.poly([(cx - nx * 8 - dx * 8, cy - ny * 8 - dy * 8), (cx + nx * 8 - dx * 8, cy + ny * 8 - dy * 8),
                              (cx + nx * 8 + dx * 8, cy + ny * 8 + dy * 8), (cx - nx * 8 + dx * 8, cy - ny * 8 + dy * 8)])
                  p.ell((34, 34, 94, 94))
                  p.d.ellipse([50 * K, 50 * K, 78 * K, 78 * K], fill=(255, 255, 255, 0))
              elif name == "menu":
                  for y in (40, 58, 76):
                      p.rrect((32, y, 96, y + 11), 5)
              elif name == "back":
                  p.line([(78, 28), (42, 64), (78, 100)], 11)
              elif name == "cs_buy":
                  p.ell((24, 24, 104, 104), fill=False, w=7)
                  p.text("$", 64, 62, 66)
              elif name == "cs_autobuy":
                  p.line([(22, 34), (38, 34), (48, 78), (92, 78)], 7)
                  p.poly([(40, 44), (100, 44), (92, 70), (46, 70)])
                  p.ell((46, 88, 62, 104)); p.ell((78, 88, 94, 104))
              elif name in ("cs_radio1", "cs_radio2", "cs_radio3"):
                  walkie(p, name[-1])
              elif name == "cs_score":
                  p.rrect((30, 70, 48, 100), 3); p.rrect((55, 46, 73, 100), 3); p.rrect((80, 28, 98, 100), 3)
              elif name == "cs_drop":
                  p.rrect((24, 30, 86, 48), 4); p.rrect((24, 44, 52, 66), 4); p.rrect((62, 46, 72, 58), 3)
                  p.line([(100, 32), (100, 84)], 8)
                  p.poly([(84, 78), (116, 78), (100, 104)])
              elif name.startswith("n") and name[1:].isdigit():
                  p.text(name[1:], 64, 64, 70)
              return p.done()

          NAMES = ["use", "jump", "shoot", "shoot_alt", "crouch", "tduck", "zoom", "speed", "load", "save", "reload",
                   "flash_light_filled", "next_weap", "prev_weap", "settings", "menu", "back",
                   "cs_buy", "cs_autobuy", "cs_radio1", "cs_radio2", "cs_radio3", "cs_score", "cs_drop"] + ["n%d" % i for i in range(1, 10)]

          def write_vtf(path, im):
              data = im.convert("RGBA").tobytes()  # RGBA8888 = format 0
              flags = 0x4 | 0x8 | 0x100 | 0x200    # clamp s/t, no mip, no lod
              hdr = struct.pack("<4sIIIHHIHH4s3f4sfIBIBBH",
                                b"VTF\0", 7, 2, 80, S, S, flags, 1, 0, b"\0" * 4,
                                0.5, 0.5, 0.5, b"\0" * 4, 1.0, 0, 1, 0xFFFFFFFF, 0, 0, 1)
              hdr += b"\0" * (80 - len(hdr))
              with open(path, "wb") as f:
                  f.write(hdr + data)

          VMT = '''"UnlitGeneric"
          {
          \t"$basetexture" "vgui/touch/%s"
          \t"$translucent" 1
          \t"$vertexcolor" 1
          \t"$vertexalpha" 1
          \t"$ignorez" 1
          \t"$nolod" 1
          \t"$nomip" 1
          }
          '''

          for n in NAMES:
              write_vtf(os.path.join(OUT, n + ".vtf"), icon(n))
              open(os.path.join(OUT, n + ".vmt"), "w").write(VMT % n)
          print("icons:", len(os.listdir(OUT)))
          ICONS_EOF
          python3 /tmp/touch_icons.py app/src/main/assets/extras/materials/vgui/touch
          mkdir -p app/src/main/assets/extras/cfg
          cat > app/src/main/assets/extras/cfg/touch_default_cstrike.cfg <<'CFG_EOF'
          // SourceDroid touch layout for Counter-Strike: Source
          touch_removeall
          touch_addbutton "look" "" "_look" 0.5 0 1 1
          touch_addbutton "move" "" "_move" 0 0 0.5 1
          touch_addbutton "use" "vgui/touch/use" "+use" 0.880000 0.213333 1.000000 0.213333 255 255 255 115 0 1.070000
          touch_addbutton "jump" "vgui/touch/jump" "+jump" 0.880000 0.462222 1.000000 0.462222 255 255 255 115 0 1.070000
          touch_addbutton "attack" "vgui/touch/shoot" "+attack" 0.760000 0.583333 0.880000 0.583333 255 255 255 115 0 1.070000
          touch_addbutton "attack2" "vgui/touch/shoot_alt" "+attack2" 0.760000 0.320000 0.880000 0.320000 255 255 255 115 0 1.070000
          touch_addbutton "duck" "vgui/touch/crouch" "+duck" 0.880000 0.746667 1.000000 0.746667 255 255 255 115 0 1.070000
          touch_addbutton "tduck" "vgui/touch/tduck" ";+duck" 0.560000 0.817778 0.620000 0.817778 255 255 255 115 0 1.070000
          touch_addbutton "zoom" "vgui/touch/zoom" "+zoom" 0.680000 0.000000 0.760000 0.000000 255 255 255 115 0 1.070000
          touch_addbutton "speed" "vgui/touch/speed" "+speed" 0.180000 0.568889 0.280000 0.568889 255 255 255 115 0 1.070000
          touch_addbutton "loadquick" "vgui/touch/load" "load quick" 0.760000 0.000000 0.840000 0.000000 255 255 255 115 0 1.070000
          touch_addbutton "savequick" "vgui/touch/save" "save quick" 0.840000 0.000000 0.920000 0.000000 255 255 255 115 0 1.070000
          touch_addbutton "reload" "vgui/touch/reload" "+reload" 0.000000 0.320000 0.120000 0.320000 255 255 255 115 0 1.070000
          touch_addbutton "flashlight" "vgui/touch/flash_light_filled" "impulse 100" 0.920000 0.000000 1.000000 0.000000 255 255 255 115 0 1.070000
          touch_addbutton "invnext" "vgui/touch/next_weap" "invnext" 0.000000 0.533333 0.120000 0.533333 255 255 255 115 0 1.070000
          touch_addbutton "invprev" "vgui/touch/prev_weap" "invprev" 0.000000 0.071111 0.120000 0.071111 255 255 255 115 0 1.070000
          touch_addbutton "edit" "vgui/touch/settings" "touch_enableedit" 0.420000 0.000000 0.500000 0.000000 255 255 255 115 0 1.070000
          touch_addbutton "menu" "vgui/touch/menu" "gameui_activate" 0.000000 0.000000 0.080000 0.000000 255 255 255 115 0 1.070000
          touch_addbutton "cs_buy" "vgui/touch/cs_buy" "buy" 0.090000 0.000000 0.150000 0.000000 255 255 255 115 0 1.000000
          touch_addbutton "cs_autobuy" "vgui/touch/cs_autobuy" "autobuy" 0.150000 0.000000 0.210000 0.000000 255 255 255 115 0 1.000000
          touch_addbutton "cs_radio1" "vgui/touch/cs_radio1" "radio1" 0.210000 0.000000 0.270000 0.000000 255 255 255 115 0 1.000000
          touch_addbutton "cs_radio2" "vgui/touch/cs_radio2" "radio2" 0.270000 0.000000 0.330000 0.000000 255 255 255 115 0 1.000000
          touch_addbutton "cs_radio3" "vgui/touch/cs_radio3" "radio3" 0.330000 0.000000 0.390000 0.000000 255 255 255 115 0 1.000000
          touch_addbutton "cs_score" "vgui/touch/cs_score" "+showscores" 0.500000 0.000000 0.560000 0.000000 255 255 255 115 0 1.000000
          touch_addbutton "cs_drop" "vgui/touch/cs_drop" "drop" 0.560000 0.000000 0.620000 0.000000 255 255 255 115 0 1.000000
          touch_addbutton "n1" "vgui/touch/n1" "menuselect 1" 0.300000 0.915000 0.348000 0.915000 255 255 255 100 0 1.000000
          touch_addbutton "n2" "vgui/touch/n2" "menuselect 2" 0.350000 0.915000 0.398000 0.915000 255 255 255 100 0 1.000000
          touch_addbutton "n3" "vgui/touch/n3" "menuselect 3" 0.400000 0.915000 0.448000 0.915000 255 255 255 100 0 1.000000
          touch_addbutton "n4" "vgui/touch/n4" "menuselect 4" 0.450000 0.915000 0.498000 0.915000 255 255 255 100 0 1.000000
          touch_addbutton "n5" "vgui/touch/n5" "menuselect 5" 0.500000 0.915000 0.548000 0.915000 255 255 255 100 0 1.000000
          touch_addbutton "n6" "vgui/touch/n6" "menuselect 6" 0.550000 0.915000 0.598000 0.915000 255 255 255 100 0 1.000000
          touch_addbutton "n7" "vgui/touch/n7" "menuselect 7" 0.600000 0.915000 0.648000 0.915000 255 255 255 100 0 1.000000
          touch_addbutton "n8" "vgui/touch/n8" "menuselect 8" 0.650000 0.915000 0.698000 0.915000 255 255 255 100 0 1.000000
          touch_addbutton "n9" "vgui/touch/n9" "menuselect 9" 0.700000 0.915000 0.748000 0.915000 255 255 255 100 0 1.000000
          CFG_EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Cache engine build
        if: ${{ inputs.with_engine }}
        uses: actions/cache@v4
        with:
          path: |
            project/engine
            project/.ndk
          key: engine-cache-v2
      - name: Patch engine to log the call stack of the memory error
        if: ${{ inputs.with_engine }}
        working-directory: project
        run: |
          [ -d engine/.git ] || { git clone https://github.com/nillerusr/source-engine engine && git -C engine checkout ed8209cc35c61fbd8ddff8480962a01c981eef2f; }
          python3 - <<'PY'
          # 1) crash handler: also write the report to <game folder>/sourcedroid_crash.log
          p = "engine/launcher/android/crashhandler.cpp"
          s = open(p).read()
          if "SdFileLog" not in s:
              old = '#define Log(msg) __android_log_print(ANDROID_LOG_DEBUG, "SRCENG", "%s", msg); DebugLogger()->Write(msg);'
              if old not in s:
                  print('crashhandler define not found, skipping')
              new = '''static void SdFileLog( const char *m )
          {
              const char *r = getenv( "VALVE_GAME_PATH" );
              char path[1024];
              snprintf( path, sizeof( path ), "%s/sourcedroid_crash.log", r ? r : "/sdcard" );
              FILE *f = fopen( path, "a" );
              if ( f ) { fputs( m, f ); fclose( f ); }
              f = fopen( "/storage/emulated/0/Download/sourcedroid_crash.log", "a" );
              if ( f ) { fputs( m, f ); fclose( f ); }
          }
          #define Log(msg) __android_log_print(ANDROID_LOG_DEBUG, "SRCENG", "%s", msg); DebugLogger()->Write(msg); SdFileLog(msg);'''
              s = s.replace(old, new, 1)
              open(p, "w").write(s)
          # 2) memory error: write size + call stack straight to <game folder>/oom_trace.txt (open/write/fsync per frame)
          import subprocess
          subprocess.call(["git", "-C", "engine", "checkout", "--", "tier0/mem.cpp"])
          p = "engine/tier0/mem.cpp"
          s = open(p).read()
          helper = r"""
          #ifdef ANDROID
          #include <dlfcn.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <pthread.h>
          static int g_oomFd = -1;
          static char g_oomMaps[400000];
          static void OomWrite( const char *s )
          {
              if ( g_oomFd >= 0 ) { write( g_oomFd, s, strlen( s ) ); fsync( g_oomFd ); }
          }
          // No unwinder (it crashes here): scan the stack for return addresses into executable library mappings.
          static void __attribute__((noinline)) OomPrintBt( size_t nSize )
          {
              const char *root = getenv( "VALVE_GAME_PATH" );
              const char *app = getenv( "APP_DATA_PATH" );
              char paths[4][600];
              snprintf( paths[0], 600, "%s/oom_trace.txt", root ? root : "/sdcard" );
              snprintf( paths[1], 600, "/storage/emulated/0/oom_trace.txt" );
              snprintf( paths[2], 600, "/storage/emulated/0/Download/oom_trace.txt" );
              snprintf( paths[3], 600, "%s/files/oom_trace.txt", app ? app : "/data/local/tmp" );
              int mfd = open( "/proc/self/maps", O_RDONLY );
              int mlen = 0;
              if ( mfd >= 0 )
              {
                  int r;
                  while ( mlen < (int)sizeof( g_oomMaps ) - 1 && ( r = read( mfd, g_oomMaps + mlen, sizeof( g_oomMaps ) - 1 - mlen ) ) > 0 ) mlen += r;
                  close( mfd );
              }
              g_oomMaps[mlen] = 0;
              volatile uintptr_t marker = 0;
              uintptr_t *sp = (uintptr_t*)&marker;
              int maxWords = 12000;
              {
                  pthread_attr_t at; void *sa = 0; size_t ss = 0;
                  if ( pthread_getattr_np( pthread_self(), &at ) == 0 )
                  {
                      pthread_attr_getstack( &at, &sa, &ss );
                      pthread_attr_destroy( &at );
                      long left = (long)( ( (uintptr_t)sa + ss - (uintptr_t)sp ) / sizeof( uintptr_t ) );
                      if ( left < maxWords ) maxWords = left > 0 ? (int)left : 0;
                  }
                  else maxWords = 2000;
              }
              for ( int k = 0; k < 4; k++ )
              {
                  g_oomFd = open( paths[k], O_WRONLY | O_CREAT | O_TRUNC, 0666 );
                  if ( g_oomFd < 0 ) continue;
                  char line[900];
                  snprintf( line, sizeof line, "OOM: failed allocation of %u bytes (file %s)\n", (unsigned)nSize, paths[k] );
                  OomWrite( line );
                  int hits = 0;
                  for ( int i = 0; i < maxWords && hits < 120; i++ )
                  {
                      uintptr_t v = sp[i];
                      if ( v < 0x10000 ) continue;
                      // find the mapping line containing v with 'x' permission
                      const char *p = g_oomMaps;
                      while ( p && *p )
                      {
                          unsigned long lo = 0, hi = 0;
                          char perm[8] = {0};
                          if ( sscanf( p, "%lx-%lx %7s", &lo, &hi, perm ) == 3 && v >= lo && v < hi )
                          {
                              if ( perm[2] == 'x' )
                              {
                                  const char *path = strchr( p, '/' );
                                  const char *eol = strchr( p, '\n' );
                                  if ( path && eol && path < eol && strstr( path, ".so" ) )
                                  {
                                      char lib[600]; int n = (int)( eol - path ); if ( n > 599 ) n = 599;
                                      memcpy( lib, path, n ); lib[n] = 0;
                                      Dl_info d;
                                      unsigned long base = dladdr( (void*)v, &d ) ? (unsigned long)d.dli_fbase : lo;
                                      snprintf( line, sizeof line, "0x%lX:\tstack[%d] (base=0x%lX, %s)\n", (unsigned long)v - base, i, base, lib );
                                      OomWrite( line );
                                      hits++;
                                  }
                              }
                              break;
                          }
                          p = strchr( p, '\n' );
                          if ( p ) p++;
                      }
                  }
                  OomWrite( "OOM end of trace\n" );
                  close( g_oomFd );
                  g_oomFd = -1;
              }
          }
          #endif
          """
          import textwrap
          helper = textwrap.dedent(helper)
          s = s.replace("static bool s_oomerror_called = false;\n", "static bool s_oomerror_called = false;\n" + helper, 1)
          s = s.replace("\t\ts_oomerror_called = true;\n", "\t\ts_oomerror_called = true;\n#ifdef ANDROID\n\t\tOomPrintBt( nSize );\n#endif\n", 1)
          assert "OomPrintBt( nSize )" in s
          open(p, "w").write(s)
          PY
          grep -n "SdFileLog" engine/launcher/android/crashhandler.cpp | head -3
          grep -n "OomPrintBt" engine/tier0/mem.cpp

      - name: Patch materialsystem (stop endless thread-event loop in EndFrame)
        if: ${{ inputs.with_engine }}
        working-directory: project
        run: |
          [ -d engine/.git ] || { git clone https://github.com/nillerusr/source-engine engine && git -C engine checkout ed8209cc35c61fbd8ddff8480962a01c981eef2f; }
          git -C engine checkout -- materialsystem/cmaterialsystem.cpp
          python3 - <<'PY'
          p = "engine/materialsystem/cmaterialsystem.cpp"
          s = open(p).read()
          T = "\t"
          old = (T*2 + "for ( int i = 0; i < m_threadEvents.Count(); i++ )\n" +
                 T*2 + "{\n" +
                 T*3 + "g_pShaderDevice->HandleThreadEvent(m_threadEvents[i]);\n" +
                 T*2 + "}\n" +
                 T*2 + "m_threadEvents.RemoveAll();\n")
          new = (T*2 + "if ( m_threadEvents.Count() )\n" +
                 T*2 + "{\n" +
                 T*3 + "// Single-threaded: this thread must own the device, otherwise the handlers re-post the event forever.\n" +
                 T*3 + "g_pShaderAPI->AcquireThreadOwnership();\n" +
                 T*3 + "// Handle only events queued so far; ones re-posted meanwhile wait for the next frame.\n" +
                 T*3 + "int nEvents = m_threadEvents.Count();\n" +
                 T*3 + "for ( int i = 0; i < nEvents; i++ )\n" +
                 T*3 + "{\n" +
                 T*4 + "g_pShaderDevice->HandleThreadEvent( m_threadEvents[i] );\n" +
                 T*3 + "}\n" +
                 T*3 + "m_threadEvents.RemoveMultiple( 0, nEvents );\n" +
                 T*3 + "if ( m_threadEvents.Count() > 64 )\n" +
                 T*4 + "m_threadEvents.RemoveAll();\n" +
                 T*2 + "}\n")
          assert s.count(old) == 1
          open(p, "w").write(s.replace(old, new, 1))
          PY
          grep -n "Handle only events" engine/materialsystem/cmaterialsystem.cpp

      - name: Patch touch defaults (per-game touch_default_<game>.cfg)
        if: ${{ inputs.with_engine }}
        working-directory: project
        run: |
          [ -d engine/.git ] || { git clone https://github.com/nillerusr/source-engine engine && git -C engine checkout ed8209cc35c61fbd8ddff8480962a01c981eef2f; }
          git -C engine checkout -- game/client/touch.cpp
          python3 - <<'PY'
          p = "engine/game/client/touch.cpp"
          s = open(p).read()
          o1 = '\tQ_snprintf(buf, sizeof buf, "cfg/%s", TOUCH_DEFAULT_CFG);\n'
          o2 = '\t\tQ_snprintf(buf, sizeof buf, "exec %s", TOUCH_DEFAULT_CFG);\n'
          assert s.count(o1) == 1 and s.count(o2) == 1
          n1 = ('\tchar defcfg[96];\n'
                '\tQ_snprintf(defcfg, sizeof defcfg, "touch_default_%s.cfg", V_UnqualifiedFileName( engine->GetGameDirectory() ));\n'
                '\tQ_strlower( defcfg );\n'
                '\tQ_snprintf(buf, sizeof buf, "cfg/%s", defcfg);\n'
                '\tif( !filesystem->FileExists(buf) )\n'
                '\t\tQ_strncpy( defcfg, TOUCH_DEFAULT_CFG, sizeof defcfg );\n'
                '\tQ_snprintf(buf, sizeof buf, "cfg/%s", defcfg);\n')
          n2 = '\t\tQ_snprintf(buf, sizeof buf, "exec %s", defcfg);\n'
          s = s.replace(o1, n1, 1).replace(o2, n2, 1)
          assert s.count('rgba_t color(255, 255, 255, 155);') == 2
          s = s.replace('rgba_t color(255, 255, 255, 155);', 'rgba_t color(255, 255, 255, 115);')
          s = s.replace('rgba_t color(255, 255, 255, 155);', 'rgba_t color(255, 255, 255, 105);')
          open(p, "w").write(s)
          PY
          grep -n "defcfg" engine/game/client/touch.cpp

      - name: Build engine
        if: ${{ inputs.with_engine }}
        working-directory: project
        env:
          ENGINE_REF: ed8209cc35c61fbd8ddff8480962a01c981eef2f
        run: bash scripts/build_engine.sh
      - name: Build per-game client/server libraries (cstrike, episodic)
        if: ${{ inputs.with_engine }}
        continue-on-error: true
        working-directory: project
        run: |
          NDK="$PWD/.ndk/android-ndk-r10e"
          export ANDROID_NDK_HOME="$NDK" NDK_HOME="$NDK"
          STRIP=$(find "$NDK/toolchains/arm-linux-androideabi-4.9" -name 'arm-linux-androideabi-strip' | head -1)
          PY="$(command -v python2 || command -v python3)"
          cd engine
          for g in cstrike episodic; do
            echo "=== game variant: $g"
            touch /tmp/mark_$g; sleep 1
            (
              set -e
              "$PY" ./waf configure -T release --android=armeabi-v7a-hard,4.9,21 --togles --disable-warns --build-games=$g
              "$PY" ./waf build --targets=client,server
              mkdir -p ../app/src/main/assets/gamelibs/$g
              for n in client server; do
                f=$(find build -name "lib$n.so" -newer /tmp/mark_$g | head -1)
                [ -n "$f" ] || { echo "lib$n.so not built for $g"; exit 1; }
                cp -v "$f" ../app/src/main/assets/gamelibs/$g/
                "$STRIP" --strip-unneeded ../app/src/main/assets/gamelibs/$g/lib$n.so
              done
            ) || { echo "variant $g FAILED, skipping"; rm -rf ../app/src/main/assets/gamelibs/$g; }
          done
          ls -laR ../app/src/main/assets/gamelibs || true
      - name: Symbolize call stack from bt.txt (if the file exists in the repo)
        if: ${{ inputs.with_engine }}
        run: |
          [ -f bt.txt ] || [ -f oom_trace.txt ] || { echo "no bt.txt / oom_trace.txt, skipping"; exit 0; }
          TOOL=$(find project/.ndk/android-ndk-r10e/toolchains/arm-linux-androideabi-4.9 -name 'arm-linux-androideabi-addr2line' | head -1)
          python3 - "$TOOL" <<'PY'
          import re, subprocess, sys, glob, os
          tool = sys.argv[1]
          lines = []
          for fn in ("bt.txt", "oom_trace.txt"):
              if os.path.exists(fn):
                  lines += open(fn, errors="ignore").read().splitlines()
          for line in lines:
              m = re.match(r"\s*0x([0-9A-Fa-f]+):.*?(\S+\.so)\)", line)
              if not m:
                  continue
              off, lib = int(m.group(1), 16), os.path.basename(m.group(2))
              cands = glob.glob("project/engine/build/**/" + lib, recursive=True)
              if not cands:
                  print("NOLIB", lib, hex(off)); continue
              a = (off & ~1) - 2
              r = subprocess.run([tool, "-f", "-C", "-e", cands[0], hex(a)], capture_output=True, text=True)
              print("SYM", lib, hex(off), "=>", " @ ".join(r.stdout.split("\n")[:2]))
          PY

      - name: Disable SDL HIDAPI (its native library is not built)
        working-directory: project
        run: |
          F=engine/thirdparty/SDL-src/android-project/app/src/main/java/org/libsdl/app/HIDDeviceManager.java
          sed -i 's/public static HIDDeviceManager acquire(Context context) {/public static HIDDeviceManager acquire(Context context) { if (true) return null;/' "$F"
          grep -n "if (true) return null" "$F"
      - name: Strip debug symbols from engine libraries
        if: ${{ inputs.with_engine }}
        working-directory: project
        run: |
          STRIP=$(find .ndk/android-ndk-r10e/toolchains/arm-linux-androideabi-4.9 -name 'arm-linux-androideabi-strip' | head -1)
          echo "strip tool: $STRIP"
          du -sh app/src/main/jniLibs
          find app/src/main/jniLibs -name '*.so' -exec "$STRIP" --strip-unneeded {} \;
          du -sh app/src/main/jniLibs
      - name: Build APK
        working-directory: project
        run: |
          sed -i '/^android {/a\    lint { checkReleaseBuilds = false; abortOnError = false }' app/build.gradle.kts
          gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SourceDroid-apk
          path: project/app/build/outputs/apk/release/*.apk
          
