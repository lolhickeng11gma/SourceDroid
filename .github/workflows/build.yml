name: Build APK

on:
  workflow_dispatch:
    inputs:
      with_engine:
        description: "Build the Source engine into the APK"
        type: boolean
        default: true

jobs:
  apk:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # UNPACK SOURCEDROID PROJECT
      # ============================================================

      - name: Unpack project
        run: |
          set -e

          check() {
            f="chunks/part$1.txt"

            if [ ! -f "$f" ]; then
              echo "ERROR: file $f is missing"
              exit 1
            fi

            h=$(tr -d ' \r\n\t' < "$f" | sha256sum | cut -d' ' -f1)

            if [ "$h" != "$2" ]; then
              echo "ERROR: file $f is damaged or incomplete"
              exit 1
            fi
          }

          check 1 ec02df5874855ae519eeafea7dfa51a2f2daf384b692bf1fa3062d5c528b8156
          check 2 7e60bf90484b4aa4fa521e04fad17a82ce2a66a6f81aeb8174dbc3c54130a128
          check 3 22766befe8b5b26b90b1abef345dbd9e3af6e169a06c50773d4cd73896c18d7a

          mkdir -p project

          cat chunks/part*.txt | base64 -d | tar xJ -C project


      # ============================================================
      # ANDROID ACTIVITY + FONTS
      # ============================================================

      - name: Patch Android activity and fonts
        working-directory: project
        run: |
          set -e

          mkdir -p app/src/engine/java/com/valvesoftware

          cat > app/src/engine/java/com/valvesoftware/ValveActivity
